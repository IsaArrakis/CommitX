name: Testes Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [testes, tests]
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências declaradas
        run: python -m pip install -r requirements.txt
      - name: Registrar escopo
        run: |
          printf '%s\n' \
            'A suíte usa fixtures sintéticas e repositórios temporários.' \
            'Inferência com os artefatos V12 oficiais e avaliação externa exigem insumos locais.' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Executar suíte
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: python -m unittest discover -s "$TEST_SUITE" -v
